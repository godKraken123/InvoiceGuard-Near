[package]
name = "invoiceguard"
version = "0.1.0"
edition = "2021"
description = "InvoiceGuard: on-chain payment authorization for AI agents"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "=5.30.1", features = ["legacy"] }

[dev-dependencies]
near-sdk = { version = "=5.30.1", features = ["legacy", "unit-testing"] }
# Same Ed25519 implementation the NEAR runtime uses; dev-only, used by
# unit tests to produce vendor signatures.
ed25519-dalek = "=2.2.0"

# Profiles are defined in the workspace root Cargo.toml (per-package
# profiles are ignored for workspace members). Both profiles enable
# overflow checks so treasury arithmetic can never silently wrap.
